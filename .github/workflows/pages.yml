name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build game
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for branch-based Pages publication
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const deadline = Date.now() + 10 * 60 * 1000;
            const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let branchRun;
            const discoveryDeadline = Date.now() + 30 * 1000;

            while (!branchRun && Date.now() < discoveryDeadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
                head_sha: context.sha,
                per_page: 100,
              });
              branchRun = data.workflow_runs.find(
                (run) => run.name === 'pages build and deployment' && run.event === 'dynamic',
              );
              if (!branchRun) await pause(3000);
            }

            if (!branchRun) {
              core.info('No branch-based Pages publication found; continuing.');
              return;
            }

            while (branchRun.status !== 'completed' && Date.now() < deadline) {
              await pause(5000);
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
                head_sha: context.sha,
                per_page: 100,
              });
              branchRun = data.workflow_runs.find((run) => run.id === branchRun.id);
            }

            if (branchRun.status !== 'completed') {
              throw new Error('Timed out waiting for the branch-based Pages publication.');
            }
            if (branchRun.conclusion !== 'success') {
              throw new Error(`Branch-based Pages publication failed: ${branchRun.conclusion}.`);
            }

            core.info('Branch-based Pages publication completed successfully.');

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
